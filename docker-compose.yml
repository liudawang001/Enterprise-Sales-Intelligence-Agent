services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sales_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sales-intelligence-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sales-intelligence-postgres:
