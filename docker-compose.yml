services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sales_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-sales_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your local environment}
    volumes:
      - sales-intelligence-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sales_app} -d ${POSTGRES_DB:-sales_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sales-intelligence-redis:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    profiles: ["ops"]
    environment: &api-env
      APP_ENV: production
      AUTH_MODE: jwt
      AUTH_ISSUER: ${AUTH_ISSUER:?set AUTH_ISSUER}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:?set AUTH_AUDIENCE}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:?set AUTH_JWKS_URL}
      GRAPH_CHECKPOINTER: postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sales_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sales_intelligence}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-sales_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sales_intelligence}
      CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-sales_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sales_intelligence}
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8080}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      ENTERPRISE_PROVIDER: commercial
      ENTERPRISE_API_BASE_URL: ${ENTERPRISE_API_BASE_URL:?set ENTERPRISE_API_BASE_URL}
      ENTERPRISE_API_KEY: ${ENTERPRISE_API_KEY:?set ENTERPRISE_API_KEY}
      MAP_PROVIDER: amap
      AMAP_API_KEY: ${AMAP_API_KEY:?set AMAP_API_KEY}
      WEB_SEARCH_PROVIDER: tavily
      TAVILY_API_KEY: ${TAVILY_API_KEY:?set TAVILY_API_KEY}
      WEB_FETCH_PROVIDER: firecrawl
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:?set FIRECRAWL_API_KEY}
      EXPORT_DIR: /app/data/exports
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  checkpointer-init:
    build: .
    profiles: ["ops"]
    environment: *api-env
    command: ["python", "-m", "scripts.init_checkpointer"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *api-env
    volumes:
      - sales-intelligence-exports:/app/data/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sales-intelligence-postgres:
  sales-intelligence-redis:
  sales-intelligence-exports:
