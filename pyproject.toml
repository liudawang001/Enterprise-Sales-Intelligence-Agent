[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-sales-intelligence-agent"
version = "0.4.0"
description = "Enterprise Sales Intelligence Agent with bounded multi-source enterprise research"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-postgres>=0.0.16",
    "langchain-huggingface>=0.1",
    "langchain-openai>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pymupdf>=1.25",
    "jieba>=0.42",
    "sentence-transformers>=3.3",
    "python-multipart>=0.0.18",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not external'"
markers = ["integration: requires PostgreSQL with pgvector", "external: consumes configured provider credentials"]

[tool.setuptools.packages.find]
include = ["app*"]
