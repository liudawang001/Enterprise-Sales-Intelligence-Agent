[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-sales-intelligence-agent"
version = "0.8.0"
description = "Production-engineered enterprise sales intelligence agent with durable LangGraph execution"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres==3.1.2",
    "langchain-core>=0.3",
    "langchain-postgres>=0.0.16",
    "langchain-openai==1.3.4",
    "openai==2.33.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg[pool]>=3.2",
    "redis==6.4.0",
    "langfuse==4.15.2",
    "PyJWT[crypto]==2.13.0",
    "boto3==1.43.92",
    "pgvector>=0.3",
    "pymupdf>=1.25",
    "jieba>=0.42",
    "python-multipart>=0.0.18",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.11", "pip-audit>=2.8", "locust>=2.32"]
local-embedding = ["langchain-huggingface>=0.1", "sentence-transformers>=3.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not external'"
markers = ["integration: requires PostgreSQL with pgvector and optionally Redis", "external: consumes configured provider credentials", "recovery: exercises restart and durable recovery", "fault: injects infrastructure or provider failures"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.setuptools.packages.find]
include = ["app*"]
